
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho | EDEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabecalho"></header>

    <main class="pagina">
        <h1>MEU CARRINHO</h1>
        <p>Confira seus produtos antes de finalizar.</p>

        <div class="caixa">
            <div id="itensCarrinho"></div>

            <div class="total">
                <h2>Total: R$ <span id="valorTotal">0,00</span></h2>
                <button class="botao" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
                <button class="botao botao-contorno" onclick="limparCarrinho()">LIMPAR CARRINHO</button>
            </div>
        </div>
    </main>

    <footer id="rodape"></footer>
    <script src="script.js"></script>
</body>
</html>
