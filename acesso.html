
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta | EDEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabecalho"></header>

    <main class="pagina">
        <h1>MINHA CONTA</h1>
        <p>Entre ou cadastre-se para aproveitar a EDEN.</p>

        <div class="caixas-acesso">
            <form class="formulario" id="formLogin">
                <h2>FAZER LOGIN</h2>

                <label>E-mail</label>
                <input type="email" id="loginEmail" maxlength="60" required>

                <label>Senha</label>
                <input type="password" id="loginSenha" maxlength="30" required>

                <button class="botao" type="submit">ENTRAR</button>
            </form>

            <form class="formulario" id="formCadastro">
                <h2>CRIAR CONTA</h2>

                <label>Nome completo</label>
                <input type="text" id="nome" maxlength="60" required>

                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>

                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>

                <label>E-mail</label>
                <input type="email" id="email" maxlength="60" required>

                <label>CEP</label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>

                <label>Senha</label>
                <input type="password" id="senha" minlength="6" maxlength="20" required>

                <button class="botao" type="submit">CADASTRAR</button>
            </form>
        </div>
    </main>

    <footer id="rodape"></footer>
    <script src="script.js"></script>
</body>
</html>
